<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PingPilot — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #24252f; color: #E7ECF5; font-family: Inter, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .box { text-align: center; padding: 2rem; }
    .dot { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: #1DB86D; margin-bottom: 1.2rem; }
    h1 { font-size: 1.3rem; margin-bottom: .5rem; font-family: "Space Grotesk", sans-serif; }
    p { color: #9a99a0; font-size: .9rem; }
    a { color: #2FD48F; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <span class="dot"></span>
    <h1>You're offline</h1>
    <p>PingPilot needs an internet connection to fetch live status.<br>
    Reconnect and <a href="/dashboard/">retry</a>.</p>
  </div>
</body>
</html>
