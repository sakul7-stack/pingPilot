<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body{ margin:0; padding:0; background-color:#0B1220; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; }
    .container{ max-width:560px; margin:40px auto; background:#101A2E; border-radius:16px; overflow:hidden; border:1px solid #1E2A44; }
    .header{ padding:36px 40px 24px; text-align:center; }
    .header .icon{ width:56px; height:56px; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; background:rgba(29,184,109,0.16); font-size:28px; }
    .header h1{ margin:0; color:#1DB86D; font-size:22px; font-weight:600; font-family:'Space Grotesk',sans-serif; }
    .body{ padding:0 40px 32px; }
    .body p{ color:#9a99a0; font-size:15px; line-height:1.7; margin:0 0 12px; }
    .info{ background:rgba(255,255,255,0.03); padding:20px 24px; border-radius:12px; margin:20px 0; border:1px solid #1E2A44; }
    .info dt{ color:#E7ECF5; font-size:13px; font-weight:500; margin-top:12px; }
    .info dt:first-child{ margin-top:0; }
    .info dd{ color:#9a99a0; font-size:14px; margin:2px 0 0; }
    .divider{ height:1px; background:#1E2A44; margin:0 40px; }
    .footer{ padding:24px 40px; text-align:center; }
    .footer p{ color:#5a5960; font-size:12px; margin:4px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="icon">🟢</div>
      <h1>{{ monitor.name }} is back UP</h1>
    </div>
    <div class="body">
      <p>Good news — <strong style="color:#E7ECF5;">{{ monitor.name }}</strong> is responding normally again.</p>
      <div class="info">
        <dt>URL</dt>
        <dd>{{ monitor.url }}</dd>
        <dt>Recovered at</dt>
        <dd>{{ recovered_at|date:"Y-m-d H:i:s" }} UTC</dd>
      </div>
    </div>
    <div class="divider"></div>
    <div class="footer">
      <p>&copy; 2026 PingPilot. All rights reserved.</p>
      <p>Monitoring Made Simple</p>
    </div>
  </div>
</body>
</html>
