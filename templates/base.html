{% load static %}
<html>
    <head>
        <title>
            PingPilot
        </title>
        <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
        <script src="https://unpkg.com/htmx.org@2.0.4"></script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/global.css' %}">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    </head>
    <body>

{% block navbar %}
<nav class="navbar navbar-expand" style="background: #2f2e34; border-bottom: 1px solid var(--pp-border);">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/" style="color: var(--pp-signal); font-family: 'Space Grotesk', sans-serif;">
      PingPilot
    </a>
    <div class="navbar-nav ms-auto">
      {% if user.is_authenticated %}
      <a href="{% url 'settings' %}" class="btn btn-sm btn-outline-secondary" style="border-radius:50%;width:36px;height:36px;padding:0;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;">
        {{ user.first_name|first|upper|default:user.email|first|upper }}
      </a>
      {% endif %}
    </div>
  </div>
</nav>
{% endblock %}

{% block content %}

{% endblock %}

</body>
</html>
